type: object
properties:
  googleEventId:
    type: string
    description: Google Calendar event ID
  summary:
    type: string
    description: Event title/summary
  description:
    type: string
    description: Event description
  start:
    type: string
    format: date-time
    description: Event start time
  end:
    type: string
    format: date-time
    description: Event end time
required:
  - googleEventId
  - summary
  - start
  - end
