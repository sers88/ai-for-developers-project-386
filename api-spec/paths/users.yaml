paths:
  /api/me:
    get:
      tags:
        - users
      summary: Get current authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "../components/schemas/UserResponse.yaml"
        "401":
          description: Unauthorized — missing or invalid JWT
