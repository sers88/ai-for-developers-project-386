name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Lint OpenAPI spec
        run: npm run spec:lint

      - name: Bundle OpenAPI spec
        run: npm run spec:bundle

      - name: Lint frontend code
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Generate Nuxt types
        run: npx nuxt prepare

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Copy OpenAPI spec to test resources
        run: cp api-spec/dist/openapi.json backend/src/test/resources/openapi.json

      - name: Build and test with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build
        working-directory: backend

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Create environment file
        run: cp .env.example .env

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for backend
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8080/actuator/health; do echo "Waiting for backend..."; sleep 2; done'

      - name: Wait for frontend
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3000; do echo "Waiting for frontend..."; sleep 2; done'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: frontend

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Stop services
        if: always()
        run: docker compose down -v
