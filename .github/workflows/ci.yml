name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Lint OpenAPI spec
        run: npm run spec:lint

      - name: Bundle OpenAPI spec
        run: npm run spec:bundle

      - name: Lint frontend code
        run: npm run lint

      - name: Generate Nuxt types
        run: npx nuxt prepare

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Copy OpenAPI spec to test resources
        run: cp api-spec/dist/openapi.json backend/src/test/resources/openapi.json

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build -x test
        working-directory: backend
