<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>New Booking</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; max-width: 600px; margin: 0 auto;">
    <h1 style="color: #2563eb;">You have a new booking!</h1>
    <p>Hi <span th:text="${ownerName}">Organizer</span>,</p>
    <p>A new booking has been made for your event:</p>
    <table style="border-collapse: collapse; width: 100%; margin: 16px 0;">
        <tr>
            <td style="padding: 8px; border-bottom: 1px solid #eee; font-weight: bold;">Event</td>
            <td style="padding: 8px; border-bottom: 1px solid #eee;" th:text="${eventTitle}">Event</td>
        </tr>
        <tr>
            <td style="padding: 8px; border-bottom: 1px solid #eee; font-weight: bold;">Guest</td>
            <td style="padding: 8px; border-bottom: 1px solid #eee;" th:text="${guestName}">Guest</td>
        </tr>
        <tr>
            <td style="padding: 8px; border-bottom: 1px solid #eee; font-weight: bold;">Guest Email</td>
            <td style="padding: 8px; border-bottom: 1px solid #eee;" th:text="${guestEmail}">email@example.com</td>
        </tr>
        <tr>
            <td style="padding: 8px; font-weight: bold;">When</td>
            <td style="padding: 8px;" th:text="${startTime}">Time</td>
        </tr>
    </table>
    <p th:if="${notes != null and !notes.isEmpty()}">
        <strong>Guest notes:</strong><br />
        <span th:text="${notes}"></span>
    </p>
    <hr style="border: none; border-top: 1px solid #eee; margin: 24px 0;" />
    <p style="font-size: 12px; color: #999;">This is an automated email. Please do not reply.</p>
</body>
</html>
