<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Booking Cancelled</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; max-width: 600px; margin: 0 auto;">
    <h1 style="color: #dc2626;">Your booking has been cancelled</h1>
    <p>Hi <span th:text="${guestName}">Guest</span>,</p>
    <p>Your booking for <strong th:text="${eventTitle}">Event</strong> scheduled for <span th:text="${startTime}">Time</span> with <span th:text="${ownerName}">Organizer</span> has been cancelled.</p>
    <p>If you did not request this cancellation, please contact <span th:text="${ownerName}">Organizer</span> to reschedule.</p>
    <hr style="border: none; border-top: 1px solid #eee; margin: 24px 0;" />
    <p style="font-size: 12px; color: #999;">This is an automated email. Please do not reply.</p>
</body>
</html>
