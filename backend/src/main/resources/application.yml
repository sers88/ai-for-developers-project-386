spring.application.name=aifordev-backend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

app.oauth2.google.client-id=${GOOGLE_CLIENT_ID}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET}
app.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/google/callback}
app.oauth2.google.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.oauth2.google.calendar.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/calendar/google/callback}
app.oauth2.google.calendar.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.oauth2.google.calendar.encryption-key=${CALENDAR_ENCRYPTION_KEY:change-me-in-production}
